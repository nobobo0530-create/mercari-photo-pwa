<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="メルカリ写真">
<meta name="theme-color" content="#fbf5f2">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
<title>メルカリ写真</title>
</head>
<body>
<header class="top">
  <h1>メルカリ写真</h1>
  <p class="sub">たくさんの写真を、まとめ写真も使って10枚に。</p>
</header>

<main>
  <section id="empty" class="empty">
    <div class="sample" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
    <p>写真アプリから、出品する写真を<br>まとめて選んでください（11枚以上なら10枚に収めます）</p>
    <button type="button" class="pick primary">写真を選ぶ</button>
    <p class="note">写真はこのiPhoneの中だけで加工します。どこにも送りません。</p>
  </section>

  <section id="work" hidden>
    <div class="controls">
      <div class="modes two" role="radiogroup" aria-label="商品の種類">
        <label><input type="radio" name="mode" id="mode-normal" value="normal" checked><span>ふつうの商品</span></label>
        <label><input type="radio" name="mode" id="mode-black" value="black"><span>黒い商品</span></label>
      </div>
      <div>
        <p class="clabel">商品の色味（背景は白いまま）</p>
        <div id="tints" class="tints" role="radiogroup" aria-label="商品の色味"></div>
      </div>
      <label class="slider" for="bright">
        <span>明るさ <b id="bright-val">50</b></span>
        <input id="bright" type="range" min="0" max="100" step="5" value="50">
      </label>
      <label class="slider" for="sat">
        <span>鮮やかさ <b id="sat-val">50</b></span>
        <input id="sat" type="range" min="0" max="100" step="5" value="50">
      </label>
      <label class="slider" for="pink" id="pink-wrap">
        <span>色味の強さ <b id="pink-val">50</b></span>
        <input id="pink" type="range" min="0" max="100" step="5" value="50">
      </label>
      <div class="stepper" id="singles-wrap">
        <span>1枚で見せる写真</span>
        <div class="step">
          <button type="button" id="singles-minus" class="ghost" aria-label="減らす">−</button>
          <b id="singles-val">5</b>
          <button type="button" id="singles-plus" class="ghost" aria-label="増やす">＋</button>
        </div>
      </div>
      <p class="hint">選んだ順に、最初の写真から1枚ずつ使います。残りはまとめ写真になります。下の「並べ替え・アップ」で直せます。</p>
      <div class="row">
        <button type="button" class="pick ghost">写真を選び直す</button>
      </div>
    </div>

    <p id="summary" class="summary"></p>
    <p id="status" class="status" aria-live="polite"></p>
    <div id="grid" class="grid"></div>

    <h2 class="h2">並べ替え・アップ</h2>
    <p class="hint2">写真をタップして選び、別の写真をタップすると入れ替わります。選んだ写真は「アップにする」で拡大できます。</p>
    <div id="arrange" class="arrange"></div>
  </section>
</main>

<footer class="bar">
  <div id="actions" class="actions" hidden>
    <span>入れ替える写真をタップ</span>
    <button type="button" id="act-zoom" class="ghost">アップにする</button>
    <button type="button" id="act-cancel" class="ghost">やめる</button>
  </div>
  <button type="button" id="save-all" class="primary" disabled>まとめて保存</button>
</footer>

<input id="file" type="file" accept="image/*" multiple hidden>

<div id="editor" class="editor" hidden>
  <p class="etitle">指で動かして、見せたいところに合わせる</p>
  <div id="frame" class="frame"><img id="edit-img" alt="調整中の写真" draggable="false"></div>
  <label class="slider ezoom" for="zoom">
    <span>アップ <b id="zoom-val">1.0倍</b></span>
    <input id="zoom" type="range" min="1" max="4" step="0.05" value="1">
  </label>
  <div class="erow">
    <button type="button" id="edit-reset" class="ghost">元に戻す</button>
    <button type="button" id="edit-cancel" class="ghost">やめる</button>
    <button type="button" id="edit-ok" class="primary">OK</button>
  </div>
</div>


<script src="js/app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
