<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="メルカリ写真">
<meta name="theme-color" content="#fbf5f2">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
<title>メルカリ写真</title>
</head>
<body>
<header class="top">
  <h1>メルカリ写真</h1>
  <p class="sub">正方形・明るく・ピンクベージュ。汚れはそのまま。</p>
</header>

<main>
  <section id="empty" class="empty">
    <div class="sample" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
    <p>写真アプリから、出品する写真を<br>まとめて選んでください（最大20枚）</p>
    <button type="button" class="pick primary">写真を選ぶ</button>
    <p class="note">写真はこのiPhoneの中だけで加工します。どこにも送りません。</p>
  </section>

  <section id="work" hidden>
    <div class="controls">
      <label class="slider" for="bright">
        <span>明るさ <b id="bright-val">50</b></span>
        <input id="bright" type="range" min="0" max="100" step="5" value="50">
      </label>
      <label class="slider" for="pink">
        <span>ピンク <b id="pink-val">50</b></span>
        <input id="pink" type="range" min="0" max="100" step="5" value="50">
      </label>
      <div class="row">
        <button type="button" class="pick ghost">写真を選び直す</button>
      </div>
    </div>

    <p id="status" class="status" aria-live="polite"></p>
    <div id="grid" class="grid"></div>
  </section>
</main>

<footer class="bar">
  <button type="button" id="save-all" class="primary" disabled>まとめて保存</button>
</footer>

<input id="file" type="file" accept="image/*" multiple hidden>


<script src="js/app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
